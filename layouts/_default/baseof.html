<!DOCTYPE html>
<html lang="en-US">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ partial "bottom-nav.html" . }}
  {{ $js := resources.Get "js/nav.js" }}
  <script src="{{ $js.RelPermalink }}" defer></script>
</body>
</html>
