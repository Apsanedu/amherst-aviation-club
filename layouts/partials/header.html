<header class="site-header" role="banner">
  <div class="header-inner">
    <a class="brand" href="{{ .Site.Home.Permalink }}" aria-label="Amherst Aviation Club home">
      <span class="brand-emblem" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="44" height="44" role="img" aria-label="Club emblem: small airplane over runway wings">
          <circle cx="32" cy="32" r="30" fill="#faf5e9" stroke="#5d4127" stroke-width="2.5"/>
          <circle cx="32" cy="32" r="25.5" fill="none" stroke="#3f1f69" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
          <g fill="#1b2a4a">
            <path d="M32 12 L36 30 L52 34 L36 36 L34 50 L30 50 L28 36 L12 34 L28 30 Z"/>
          </g>
          <rect x="18" y="52" width="28" height="2" rx="1" fill="#5d4127"/>
          <circle cx="20" cy="20" r="2.2" fill="#c96a1b"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">Amherst Aviation Club</span>
      </span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <button class="nav-toggle" aria-expanded="false" aria-controls="nav-list" aria-label="Open menu">
        <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
      </button>
      <ul id="nav-list" class="nav-list">
        {{ range .Site.Menus.main }}
        <li><a href="{{ .URL | absURL }}" {{ if eq $.RelPermalink (.URL | relURL) }}aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
        <li class="nav-cta"><a class="btn btn-cta" href="{{ .Site.Params.joinForm }}" target="_blank" rel="noopener">Join the Club</a></li>
      </ul>
    </nav>
  </div>
</header>
